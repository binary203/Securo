{% extends "base.html" %}

{% block head %}
{% endblock %}

{% block body %}
<div class="container">
    <h1>WELCOME</h1>
    <p style="color: #888; margin-bottom: 2rem; letter-spacing: 0.1em;">Secure code analysis platform</p>
    {% if current_user.is_authenticated %}
    <div style="display: flex; gap: 1rem;">
        <form action="{{ url_for('profile') }}" method="GET">
            <button type="submit">Профиль</button>
        </form>
        <form action="{{ url_for('scan') }}" method="GET">
            <button type="submit" class="btn-outline">Сканирование</button>
        </form>
    </div>
    {% else %}
    <div style="display: flex; gap: 1rem;">
        <form action="{{ url_for('login') }}" method="GET">
            <button type="submit">Войти</button>
        </form>
        <form action="{{ url_for('registration') }}" method="GET">
            <button type="submit" class="btn-outline">Регистрация</button>
        </form>
    </div>
    {% endif %}
</div>
{% endblock %}
