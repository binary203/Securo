{% extends "base.html" %}

{% block head %}
{% endblock %}

{% block body %}
<div class="container">
    <h1>ПРОФИЛЬ</h1>

    <div class="profile-card">
        <div class="profile-info">
            <div class="profile-row">
                <span class="profile-label">Пользователь</span>
                <span class="profile-value">{{ current_user.username }}</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Дата регистрации</span>
                <span class="profile-value">{{ current_user.date_created.strftime('%d.%m.%Y') }}</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Всего сканирований</span>
                <span class="profile-value">{{ scan_count }}</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Найдено уязвимостей</span>
                <span class="profile-value">{{ vuln_count }}</span>
            </div>
        </div>

        <div class="profile-actions" style="display: flex; gap: 1rem; width: 100%;">
            <form action="{{ url_for('scan') }}" method="GET" style="flex: 1;">
                <button type="submit" style="width: 100%;">🔍 Новое сканирование</button>
            </form>
            <form action="{{ url_for('logout') }}" method="POST" style="flex: 1;">
                <button type="submit" class="btn-outline" style="width: 100%;">Выйти</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
