<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <title>Securo — Your Code is safe!</title>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="navbar-brand">SECURO</a>
        <div class="navbar-links">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('scan') }}">Сканнер</a>
                <a href="{{ url_for('profile') }}">Профиль</a>
                <form action="{{ url_for('logout') }}" method="POST" style="display: inline-block;">
                    {{ logout_form.hidden_tag() }}
                    <button type="submit" style="background: none; border: none; color: inherit; font: inherit; cursor: pointer; padding: 0;">Выход</button>
                </form>
            {% else %}
                <a href="{{ url_for('login') }}">Войти</a>
            {% endif %}
        </div>
    </nav>
    {% block body %}{% endblock %}

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <a href="{{ url_for('index') }}" class="footer-logo">SECURO</a>
                <span class="footer-tagline">// your code is safe</span>
            </div>
            <nav class="footer-social" aria-label="Социальные сети">
                <a href="https://github.com/binary203/Securo" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="GitHub">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
                        <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
                    </svg>
                </a>
                <a href="https://t.me/B1nary203" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Telegram">
                    <i data-lucide="send"></i>
                </a>
                <a href="mailto:securo.scan@mail.ru" class="social-link" aria-label="Написать письмо">
                    <i data-lucide="mail"></i>
                </a>
            </nav>
        </div>
        <div class="footer-bottom">
            <span class="footer-copy">&copy; 2025 Securo &mdash; Платформа анализа уязвимостей</span>
        </div>
    </footer>

    <div id="toast-container" aria-live="polite"
         data-messages='{{ get_flashed_messages(with_categories=true) | tojson }}'></div>

    <script src="{{ url_for('static', filename='gsap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='ScrollTrigger.min.js') }}"></script>
    <script>
    gsap.registerPlugin(ScrollTrigger);
    </script>
    <script src="{{ url_for('static', filename='lucide.min.js') }}"></script>
    <script src="{{ url_for('static', filename='animations.js') }}"></script>
    <script>lucide.createIcons();</script>

    <script>
    (function () {
        const container = document.getElementById('toast-container');

        function createToast(category, message) {
            const toast = document.createElement('div');
            const icons = { error: '✖', success: '✔', warning: '⚠', message: '◈' };
            const icon = icons[category] || icons['message'];
            toast.className = 'toast toast-' + category;
            toast.innerHTML = `
                <span class="toast-icon">${icon}</span>
                <span class="toast-text">${message}</span>
                <button class="toast-close" aria-label="Закрыть">✕</button>
            `;
            toast.querySelector('.toast-close').addEventListener('click', () => dismiss(toast));
            container.appendChild(toast);

            const timer = setTimeout(() => dismiss(toast), 4000);
            toast._timer = timer;
            return toast;
        }

        function dismiss(toast) {
            clearTimeout(toast._timer);
            toast.classList.add('toast-hide');
            toast.addEventListener('animationend', () => toast.remove(), { once: true });
        }

        var raw = container.getAttribute('data-messages');
        if (raw && raw !== '[]') {
            try {
                JSON.parse(raw).forEach(function (item) {
                    createToast(item[0], item[1]);
                });
            } catch (e) {}
        }

        window.showToast = createToast;
    })();

    (function () {
        function initTypewriter(h1) {
            var text = (h1.innerText || h1.textContent || '').trim();
            if (!text) return;

            h1.innerHTML = '<span class="type-cursor">&#x2588;</span>';
            var cursor = h1.querySelector('.type-cursor');

            var i = 0;
            setTimeout(function () {
                var interval = setInterval(function () {
                    if (i < text.length) {
                        h1.insertBefore(document.createTextNode(text[i]), cursor);
                        i++;
                    } else {
                        clearInterval(interval);
                    }
                }, 160);
            }, 300);
        }

        document.querySelectorAll('h1').forEach(initTypewriter);
    })();

    </script>
</body>
</html>
