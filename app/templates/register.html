{% extends "base.html" %}

{% block head %}
{% endblock %}

{% block body %}
    <div class="container">
        <h1>Hello Friend</h1>
        <form action="" method="post" novalidate>
            {{ form.hidden_tag() }}
        <div>
            {{ form.username.label }}<br>
            {{ form.username(size=32) }}
        </div>
        <br>
        <div>
            {{ form.password.label }}<br>
            {{ form.password(size=32) }}
        </div>
        <br>
        <div>
            {{ form.submit() }}
        </div>
        <br>
        </form>
    </div>
{% endblock %}
